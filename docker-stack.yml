# Стек BizFlow для Docker Swarm.
#   docker stack deploy -c docker-stack.yml bizflow
# Перед первым запуском нужны секреты db_password и jwt_secret
# (их создаёт scripts/swarm-init.sh) и образы в реестре $REGISTRY.

x-app-image: &api_image ${REGISTRY:-127.0.0.1:5000}/bizflow-api:${TAG:-1.0.0}

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=bizflow_public
      - --providers.swarm.refreshSeconds=5
      - --entrypoints.web.address=:80
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus.entryPoint=metrics
      - --metrics.prometheus.addServicesLabels=true
      - --api.dashboard=true
      - --api.insecure=true
      - --accesslog=true
      - --ping=true
    ports:
      - target: 80
        published: 80
      - target: 8080
        published: 8081
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [public]
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits: { cpus: "0.50", memory: 128M }

  frontend:
    image: ${REGISTRY:-127.0.0.1:5000}/bizflow-frontend:${TAG:-1.0.0}
    networks: [public]
    deploy:
      replicas: 2
      labels:
        - traefik.enable=true
        - traefik.http.routers.frontend.rule=PathPrefix(`/`)
        - traefik.http.routers.frontend.priority=1
        - traefik.http.routers.frontend.entrypoints=web
        - traefik.http.services.frontend.loadbalancer.server.port=80
      update_config: { parallelism: 1, order: start-first }
      resources:
        limits: { cpus: "0.25", memory: 64M }

  api:
    image: *api_image
    hostname: "api-{{.Task.Slot}}.{{.Node.Hostname}}"
    environment:
      DB_HOST: postgres
      DB_USER: bizflow
      DB_NAME: bizflow
      REDIS_URL: redis://redis:6379/0
      STATS_CACHE_TTL: "30"
    secrets: [db_password, jwt_secret]
    networks: [public, backend]
    stop_grace_period: 20s
    deploy:
      replicas: 3
      labels:
        - traefik.enable=true
        - traefik.http.routers.api.rule=PathPrefix(`/api`)
        - traefik.http.routers.api.priority=10
        - traefik.http.routers.api.entrypoints=web
        - traefik.http.services.api.loadbalancer.server.port=8000
        - traefik.http.services.api.loadbalancer.healthcheck.path=/api/health
        - traefik.http.services.api.loadbalancer.healthcheck.interval=5s
        # если реплика уже остановлена, а Traefik ещё не исключил её, запрос
        # повторяется на другой реплике вместо ответа 502
        - traefik.http.middlewares.api-retry.retry.attempts=3
        - traefik.http.routers.api.middlewares=api-retry
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 20s
      rollback_config: { parallelism: 1, order: start-first }
      restart_policy: { condition: on-failure, delay: 5s, max_attempts: 5 }
      resources:
        limits: { cpus: "0.50", memory: 256M }
        reservations: { cpus: "0.10", memory: 96M }

  worker:
    image: *api_image
    command: ["python", "-m", "app.worker"]
    hostname: "worker-{{.Task.Slot}}.{{.Node.Hostname}}"
    # у воркера нет HTTP-порта, поэтому проверка из Dockerfile (запрос к API)
    # заменена на проверку отметки жизни, которую воркер обновляет в каждом цикле
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-heartbeat') < 30 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    environment:
      DB_HOST: postgres
      DB_USER: bizflow
      DB_NAME: bizflow
      REDIS_URL: redis://redis:6379/0
    secrets: [db_password, jwt_secret]
    networks: [backend]
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.labels.tier
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { cpus: "0.25", memory: 128M }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bizflow
      POSTGRES_DB: bizflow
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizflow -d bizflow"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits: { cpus: "1.0", memory: 512M }

  redis:
    image: redis:7-alpine
    # Очередь событий не должна вытесняться при нехватке памяти. Политика
    # volatile-lru вытесняет только ключи со сроком жизни (кэш статистики),
    # списки очереди срока жизни не имеют. AOF сбрасывается на диск раз в секунду.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits: { cpus: "0.25", memory: 160M }

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - promdata:/prometheus
    ports:
      - target: 9090
        published: 9090
    networks: [public, backend]
    deploy:
      placement:
        constraints: [node.role == manager]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana_password]
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_dashboard_bizflow
        target: /etc/grafana/dashboards/bizflow.json
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - target: 3000
        published: 3000
    networks: [public]
    deploy:
      placement:
        constraints: [node.role == manager]

networks:
  public:
    driver: overlay
  backend:
    driver: overlay
    internal: true

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:

secrets:
  db_password:
    external: true
    # после scripts/rotate-db-password.sh секрет называется db_password_<время>
    name: ${DB_PASSWORD_SECRET:-db_password}
  jwt_secret:
    external: true
  grafana_password:
    external: true

configs:
  # Объекты configs в Swarm неизменяемы, поэтому имя содержит хеш содержимого
  # каталога monitoring (CONFIG_VERSION вычисляет scripts/deploy.sh): при
  # изменении файлов создаётся новый объект, и сервисы переключаются на него.
  prometheus_config:
    name: bizflow_prometheus_${CONFIG_VERSION:-1}
    file: ./monitoring/prometheus.yml
  grafana_datasource:
    name: bizflow_grafana_datasource_${CONFIG_VERSION:-1}
    file: ./monitoring/grafana/provisioning/datasources/datasource.yml
  grafana_dashboards:
    name: bizflow_grafana_dashboards_${CONFIG_VERSION:-1}
    file: ./monitoring/grafana/provisioning/dashboards/dashboards.yml
  grafana_dashboard_bizflow:
    name: bizflow_grafana_dashboard_${CONFIG_VERSION:-1}
    file: ./monitoring/grafana/dashboards/bizflow.json
