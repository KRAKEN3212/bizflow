# Локальный запуск для разработки (без Swarm):
#   docker compose up --build
# Этот же файл используется для сборки образов перед публикацией в реестр:
#   docker compose build && docker compose push
services:
  api:
    build: ./backend
    image: ${REGISTRY:-127.0.0.1:5000}/bizflow-api:${TAG:-1.0.0}
    environment:
      DB_HOST: postgres
      DB_PASSWORD: devpassword
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    image: ${REGISTRY:-127.0.0.1:5000}/bizflow-api:${TAG:-1.0.0}
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-heartbeat') < 30 else 1)"]
      interval: 15s
      start_period: 30s
    environment:
      DB_HOST: postgres
      DB_PASSWORD: devpassword
      REDIS_URL: redis://redis:6379/0
    depends_on: [api]

  frontend:
    build: ./frontend
    image: ${REGISTRY:-127.0.0.1:5000}/bizflow-frontend:${TAG:-1.0.0}

  proxy:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    volumes:
      - ./scripts/dev-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, frontend]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bizflow
      POSTGRES_DB: bizflow
      POSTGRES_PASSWORD: devpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "volatile-lru"]
