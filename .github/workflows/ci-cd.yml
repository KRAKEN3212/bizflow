name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Проверка кода и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Линтер
        run: ruff check app tests
      - name: Тесты
        run: pytest -q
      - name: Проверка синтаксиса стека
        working-directory: .
        run: docker compose -f docker-stack.yml config --quiet
        env:
          REGISTRY: example
          TAG: test

  build:
    name: Сборка и публикация образов
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.meta.outputs.registry }}
      deploy: ${{ steps.deploy-check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        # имя владельца в GHCR должно быть в нижнем регистре
        run: |
          echo "tag=1.0.${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: deploy-check
        # деплой выполняется, только если в репозитории заданы секреты сервера
        env:
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
        run: |
          if [ -n "$SWARM_HOST" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::Секреты сервера не заданы, этап deploy будет пропущен"; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Образ API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.registry }}/bizflow-api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry }}/bizflow-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Образ клиента
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.registry }}/bizflow-frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry }}/bizflow-frontend:latest

  cloud-test:
    name: Развёртывание и проверка в облачной среде
    # Временный кластер Swarm на облачной виртуальной машине GitHub Actions:
    # стек разворачивается из только что опубликованных образов, проверяется
    # и удаляется вместе с машиной после завершения задания.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY: ${{ needs.build.outputs.registry }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Сведения о машине
        run: |
          mkdir -p out
          { echo "Узел: $(hostname), $(nproc) vCPU, $(free -h | awk '/Mem/ {print $2}') ОЗУ"
            grep PRETTY_NAME /etc/os-release
            docker version --format 'Docker Engine {{.Server.Version}}'
            echo "REGISTRY=$REGISTRY TAG=$TAG"; } | tee out/01-machine.txt
      - name: Вход в GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Инициализация Swarm и секретов
        run: |
          docker swarm init
          docker node update --label-add tier=main "$(docker info --format '{{.Swarm.NodeID}}')"
          for s in db_password jwt_secret grafana_password; do
            openssl rand -hex 24 | docker secret create "$s" -
          done
      - name: Развёртывание стека
        run: |
          set -o pipefail
          docker stack deploy --with-registry-auth -c docker-stack.yml bizflow | tee out/02-deploy.txt
      - name: Проверка результата развёртывания
        run: |
          set -o pipefail
          TIMEOUT=300 bash scripts/check-deploy.sh | tee out/03-check.txt
      - name: Тестовые данные
        run: docker exec "$(docker ps -qf name=bizflow_api | head -1)" python -m app.seed | tee out/04-seed.txt
      - name: Дымовой тест
        run: |
          set -o pipefail
          python3 scripts/smoke.py --url http://127.0.0.1 | tee out/05-smoke.txt
      - name: Масштабирование api до 5 реплик и нагрузка
        run: |
          set -o pipefail
          docker service scale --detach=false bizflow_api=5 > /dev/null
          docker service ps bizflow_api --filter desired-state=running --format '{{.Name}}  {{.Image}}  {{.CurrentState}}' | tee out/06-scale.txt
          python3 scripts/loadtest.py --url http://127.0.0.1 --threads 10 --seconds 20 --ci --max-error-rate 0.01 | tee out/07-load.txt
      - name: Состояние стека
        if: always()
        run: |
          { docker stack services bizflow
            echo
            docker stack ps bizflow --no-trunc --format '{{.Name}} | {{.Image}} | {{.CurrentState}} | {{.Error}}'; } | tee out/08-stack.txt || true
      - name: Итоги в сводку прогона
        # сводка (Job Summary) видна на странице прогона без входа в GitHub
        if: always()
        run: |
          {
            echo "## Развёртывание в облачной среде GitHub Actions"
            for f in out/*.txt; do
              echo "### $(basename "$f" .txt)"
              echo '```'
              cat "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Развёртывание на постоянный сервер
    needs: [build, cloud-test]
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Копирование файлов стека на менеджер-узел
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          source: "docker-stack.yml,monitoring,scripts"
          target: /opt/bizflow
      - name: Обновление стека
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          script: |
            cd /opt/bizflow
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            export REGISTRY=${{ needs.build.outputs.registry }} TAG=${{ needs.build.outputs.tag }}
            SKIP_BUILD=1 bash scripts/deploy.sh
            TIMEOUT=300 bash scripts/check-deploy.sh
