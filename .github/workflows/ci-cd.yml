name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    name: Проверка кода и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Линтер
        run: ruff check app tests
      - name: Тесты
        run: pytest -q
      - name: Проверка синтаксиса стека
        working-directory: .
        run: docker compose -f docker-stack.yml config --quiet
        env:
          REGISTRY: example
          TAG: test

  build:
    name: Сборка и публикация образов
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=1.0.${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Образ API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/bizflow-api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/bizflow-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Образ клиента
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/bizflow-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/bizflow-frontend:latest

  deploy:
    name: Развёртывание в облаке
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Копирование файлов стека на менеджер-узел
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          source: "docker-stack.yml,monitoring"
          target: /opt/bizflow
      - name: Обновление стека
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          script: |
            cd /opt/bizflow
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            export REGISTRY=${{ env.REGISTRY }} TAG=${{ needs.build.outputs.tag }}
            docker stack deploy --with-registry-auth -c docker-stack.yml bizflow
            # ожидание, пока все реплики API перейдут на новую версию
            for i in $(seq 1 30); do
              running=$(docker service ps bizflow_api --filter desired-state=running --format '{{.Image}} {{.CurrentState}}' | grep -c "$TAG.*Running" || true)
              [ "$running" -ge 3 ] && break
              sleep 5
            done
            curl -fsS http://localhost/api/health
