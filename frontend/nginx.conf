server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # статика кэшируется браузером, index.html — нет, чтобы новая версия
    # клиента подхватывалась сразу после деплоя
    location ~* \.(js|css|png|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
